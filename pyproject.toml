[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvwnn"
version = "1.0.0"
description = "Time-varying weight neural networks: a faithful implementation of Rudd, Bondell & Silver (2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dr Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers = [{ name = "Dr Merwan Roudane", email = "merwanroudane920@gmail.com" }]
keywords = [
    "time-varying parameters",
    "neural networks",
    "Kalman filter",
    "EM algorithm",
    "state space models",
    "macroeconomic forecasting",
    "FRED-MD",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.0",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "statsmodels>=0.14"]
dev = ["pytest>=7.0", "statsmodels>=0.14", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/merwanroudane/tvwnn"
Repository = "https://github.com/merwanroudane/tvwnn"
Issues = "https://github.com/merwanroudane/tvwnn/issues"

[tool.setuptools.packages.find]
include = ["tvwnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*"]

[tool.ruff]
line-length = 95
target-version = "py310"
